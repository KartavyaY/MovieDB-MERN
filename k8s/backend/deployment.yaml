apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: moviedb
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: moviedb-backend:latest
          # Never pull from registry — always use the locally built image
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          # Non-sensitive config from ConfigMap
          envFrom:
            - configMapRef:
                name: backend-config
          # Sensitive values from Secret (Firebase credentials)
          env:
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FIREBASE_PROJECT_ID
            - name: FIREBASE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FIREBASE_CLIENT_EMAIL
            - name: FIREBASE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FIREBASE_PRIVATE_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
