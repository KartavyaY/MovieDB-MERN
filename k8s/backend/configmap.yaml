apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: moviedb
  labels:
    app: backend
data:
  NODE_ENV: "development"
  PORT: "5001"
  # Use host machine's MongoDB (Docker Desktop provides this hostname)
  MONGODB_URI: "mongodb://host.docker.internal:27017/movie-browser"
  # Allows the frontend service to make CORS requests
  FRONTEND_URL: "http://localhost:5173"
