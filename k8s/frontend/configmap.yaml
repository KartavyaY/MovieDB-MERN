apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: moviedb
  labels:
    app: frontend
data:
  # Backend is exposed on localhost:5001 via LoadBalancer service
  # The browser (running on your machine) reaches it through Docker Desktop
  VITE_API_BASE_URL: "http://localhost:5001/api"

  # Firebase client-side config (these are safe to be public)
  VITE_FIREBASE_API_KEY: "REDACTED"
  VITE_FIREBASE_AUTH_DOMAIN: "movie-app-mern.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID: "movie-app-mern"
  VITE_FIREBASE_STORAGE_BUCKET: "movie-app-mern.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID: "39973000803"
  VITE_FIREBASE_APP_ID: "1:39973000803:web:535697b134ea7e8b62ca56"
