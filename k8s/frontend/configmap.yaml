apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: moviedb
  labels:
    app: frontend
data:
  # Backend is exposed on localhost:5001 via LoadBalancer service
  # The browser (running on your machine) reaches it through Docker Desktop
  VITE_API_BASE_URL: "http://localhost:5001/api"

  # Firebase client-side config — values injected at deploy time via envsubst from frontend/.env
  VITE_FIREBASE_API_KEY: "${VITE_FIREBASE_API_KEY}"
  VITE_FIREBASE_AUTH_DOMAIN: "${VITE_FIREBASE_AUTH_DOMAIN}"
  VITE_FIREBASE_PROJECT_ID: "${VITE_FIREBASE_PROJECT_ID}"
  VITE_FIREBASE_STORAGE_BUCKET: "${VITE_FIREBASE_STORAGE_BUCKET}"
  VITE_FIREBASE_MESSAGING_SENDER_ID: "${VITE_FIREBASE_MESSAGING_SENDER_ID}"
  VITE_FIREBASE_APP_ID: "${VITE_FIREBASE_APP_ID}"
